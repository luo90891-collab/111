<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List - 任务管理</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="todo-wrapper">
            <div class="header">
                <h1>📝 我的任务</h1>
                <p class="subtitle">高效管理你的日常任务</p>
            </div>
            <div class="input-section">
                <div class="input-group">
                    <input type="text" id="todoInput" class="todo-input" placeholder="添加新任务..." autocomplete="off">
                    <button id="addBtn" class="add-btn">添加</button>
                </div>
                <div class="quick-actions">
                    <button id="clearCompletedBtn" class="action-btn">清除已完成</button>
                    <button id="exportBtn" class="action-btn">导出</button>
                </div>
            </div>
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="active">进行中</button>
                <button class="filter-btn" data-filter="completed">已完成</button>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">总数</span>
                    <span class="stat-value" id="totalCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">进行中</span>
                    <span class="stat-value" id="activeCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">已完成</span>
                    <span class="stat-value" id="completedCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">完成率</span>
                    <span class="stat-value" id="completionRate">0%</span>
                </div>
            </div>
            <div class="todos-container">
                <ul id="todoList" class="todo-list"></ul>
                <div id="emptyState" class="empty-state">
                    <p>🎉 没有任务了，享受生活吧！</p>
                </div>
            </div>
        </div>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/todo.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
